<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход для сотрудников — Царицыно</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: var(--space-6);
        }

        .staff-login {
            width: 100%;
            max-width: 380px;
        }

        .staff-login__logo {
            font-family: var(--font-display);
            font-size: 32px;
            text-align: center;
            margin-bottom: var(--space-8);
        }

            .staff-login__logo span {
                color: var(--accent);
            }

        .staff-login__hint {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: var(--space-4);
        }

            .staff-login__hint a {
                color: var(--text-muted);
                text-decoration: none;
            }
    </style>
</head>
<body>
    <div class="staff-login">
        <div class="staff-login__logo">Царицыно<span>.</span></div>

        <div class="form-group">
            <label class="form-label">Логин</label>
            <input class="form-input" type="text" id="staffUsername" placeholder="admin">
        </div>
        <div class="form-group">
            <label class="form-label">Пароль</label>
            <input class="form-input" type="password" id="staffPassword" placeholder="••••••">
        </div>

        <button class="btn btn--primary" id="loginBtn">Войти</button>
        <div class="msg" id="msg"></div>

        <div class="staff-login__hint">
            <a href="./auth.html">← Вход для студентов</a>
        </div>
    </div>

    <script src="./config.js"></script>
    <script>
const btn = document.getElementById('loginBtn');
const msg = document.getElementById('msg');

async function login() {
    const username = document.getElementById('staffUsername').value.trim();
    const password = document.getElementById('staffPassword').value;

    if (!username || !password) {
        msg.textContent = 'Введите логин и пароль';
        msg.className = 'msg msg--error';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Проверка...';

    try {
        const res = await fetch(`${CONFIG.API}/staff-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
            msg.textContent = 'Неверный логин или пароль';
            msg.className = 'msg msg--error';
            return;
        }

        const data = await res.json();
        sessionStorage.setItem('staffUsername', data.username);
        sessionStorage.setItem('staffRole', data.role);
        sessionStorage.setItem('staffName', data.fullName || data.username);

        window.location.href = data.role === 'admin' ? './admin.html' : './organizer.html';
    } catch {
        msg.textContent = 'Сервер недоступен';
        msg.className = 'msg msg--error';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
    }
}

btn.addEventListener('click', login);
document.getElementById('staffPassword').addEventListener('keydown', e => e.key === 'Enter' && login());
    </script>
</body>
</html>

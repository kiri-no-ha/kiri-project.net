<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лидерборд — Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="./leaderboard.html" class="navbar__logo">Game<span style="color:var(--accent)">.</span></a>
    <ul class="navbar__links">
        <li><a href="./leaderboard.html">Лидерборд</a></li>
        <li><a href="./profile.html">Профиль</a></li>
        <li><a href="./download.html">Скачать</a></li>
    </ul>
    <div class="navbar__user">Игрок: <span id="navUsername">—</span></div>
  </nav>

  <main class="page">
    <div class="container">

      <h1 class="page__title">🏆 Лидерборд</h1>
      <p class="page__subtitle">Топ игроков по количеству побед</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Игрок</th>
              <th>Победы</th>
              <th>Поражения</th>
              <th>Игр</th>
              <th>Время</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <!-- Скелетон -->
            <tr class="skeleton-row">
              <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:120px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:60px"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:60px"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:110px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:40px"></div></td>
              <td><div class="skeleton skeleton-cell" style="width:60px"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="leaderboardError" class="msg msg--error hidden" style="margin-top: var(--space-4);"></div>

    </div>
  </main>

  <script src="./config.js"></script>
  <script src="./js/leaderboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Auth</title>

    <style>

        body {
            background: #111827;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #1f2937;
            padding: 24px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
        }

        .section {
            margin-bottom: 32px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            background: #374151;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

            button:hover {
                background: #1d4ed8;
            }

        .error {
            color: #f87171;
            margin-top: 10px;
        }

        .success {
            color: #4ade80;
            margin-top: 10px;
        }

        #codeSection {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="section">
            <h2>Регистрация</h2>

            <input type="text" id="regUsername" placeholder="Username">
            <input type="email" id="regEmail" placeholder="Email">

            <button id="registerBtn">
                Создать аккаунт
            </button>

            <div id="registerMsg"></div>
        </div>

        <div class="section">
            <h2>Вход</h2>

            <input type="text" id="loginInput" placeholder="Username или Email">

            <button id="sendCodeBtn">
                Получить код
            </button>

            <div id="loginMsg"></div>

            <div id="codeSection">
                <input type="text" id="codeInput" placeholder="Код из письма">

                <button id="verifyBtn">
                    Войти
                </button>

                <div id="verifyMsg"></div>
            </div>
        </div>

    </div>

    <script>

        const API = 'https://localhost:7042';
        const regUsername = document.getElementById('regUsername');
        const regEmail = document.getElementById('regEmail');
        const registerBtn = document.getElementById('registerBtn');
        const registerMsg = document.getElementById('registerMsg');

        const loginInput = document.getElementById('loginInput');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const loginMsg = document.getElementById('loginMsg');

        const codeSection = document.getElementById('codeSection');
        const codeInput = document.getElementById('codeInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyMsg = document.getElementById('verifyMsg');

        registerBtn.onclick = async () => {

            registerMsg.className = '';
            registerMsg.innerText = '';

            const username = regUsername.value.trim();
            const email = regEmail.value.trim();

            if (!username || !email) {
                registerMsg.className = 'error';
                registerMsg.innerText = 'Заполни поля';
                return;
            }

            try {

                const response = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email
                    })
                });

                const text = await response.text();

                if (response.ok) {
                    registerMsg.className = 'success';
                    registerMsg.innerText = text;
                } else {
                    registerMsg.className = 'error';
                    registerMsg.innerText = text;
                }

            } catch {
                registerMsg.className = 'error';
                registerMsg.innerText = 'Сервер недоступен';
            }
        };

        sendCodeBtn.onclick = async () => {

            loginMsg.className = '';
            loginMsg.innerText = '';

            const login = loginInput.value.trim();

            if (!login) {
                loginMsg.className = 'error';
                loginMsg.innerText = 'Введите логин';
                return;
            }

            try {

                const response = await fetch(`${API}/request-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login
                    })
                });

                const text = await response.text();

                if (response.ok) {

                    loginMsg.className = 'success';
                    loginMsg.innerText = text;

                    codeSection.style.display = 'block';

                } else {

                    loginMsg.className = 'error';
                    loginMsg.innerText = text;
                }

            } catch {

                loginMsg.className = 'error';
                loginMsg.innerText = 'Сервер недоступен';
            }
        };

        verifyBtn.onclick = async () => {

            verifyMsg.className = '';
            verifyMsg.innerText = '';

            const login = loginInput.value.trim();
            const code = codeInput.value.trim();

            if (!code) {

                verifyMsg.className = 'error';
                verifyMsg.innerText = 'Введите код';

                return;
            }

            try {

                const response = await fetch(`${API}/verify-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login,
                        code
                    })
                });

                const text = await response.text();

                if (response.ok) {

                    verifyMsg.className = 'success';
                    verifyMsg.innerText = text;

                } else {

                    verifyMsg.className = 'error';
                    verifyMsg.innerText = text;
                }

            } catch {

                verifyMsg.className = 'error';
                verifyMsg.innerText = 'Сервер недоступен';
            }
        };

    </script>

</body>
</html>
